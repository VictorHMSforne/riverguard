Esses templates são para **diferentes tipos de projeto** (Node.js, Hugo, Gatsby, etc.). Para o seu caso (React + Vite + GitHub Pages), **nenhum deles serve direto**.

## ✅ O que você precisa fazer

Na tela de Actions, clique em **"set up a workflow yourself"** (ou "criar workflow manualmente") – é a última opção, não listada aí.

Depois, cole o seguinte conteúdo:

```yaml
# .github/workflows/deploy.yml
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version: 18
      - run: npm ci
      - run: npm run build
      - uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
```

Depois de colar:

1. Clique em **"Start commit"** (ou "Iniciar commit")
2. Dê um nome (ex: "Adiciona deploy automático")
3. Confirme o commit

A partir daí, **toda vez que você der `git push` na branch `main`**, o Actions vai fazer o build e publicar no GitHub Pages automaticamente.

---

## ❌ E os templates que aparecem?

- **Static HTML** → não executa `npm run build`, só joga os arquivos estáticos que já existem
- **Node.js** → faz teste, mas não faz deploy
- **Astro/Gatsby/Hugo** → são para frameworks específicos

Nenhum deles faz o que você precisa (build + deploy pra gh-pages). Por isso o workflow manual é a melhor escolha.

---

## 🧪 Teste local (opcional)



```bash
npm run build       # gera a pasta dist
npx gh-pages -d dist
```

Mas com o Actions isso vira automático 🚀

